<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">KNCCS 정성제안서 GraphRAG 및 온톨로지 구조</title>
  <desc id="desc">OpenCrab ontology pack의 지식그래프 스키마, 실제 사업 엔터티, 관계, GraphRAG 검색 및 답변 생성 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".55" stop-color="#0d2740"/>
      <stop offset="1" stop-color="#0b1d32"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1965d5"/>
      <stop offset="1" stop-color="#1fb7c4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6f91b7"/>
    </marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39c4d7"/>
    </marker>
    <style>
      .ko{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
      .title{font-size:34px;font-weight:800;fill:#f4f8ff}
      .sub{font-size:15px;font-weight:500;fill:#a9bdd4}
      .section{font-size:22px;font-weight:800;fill:#f4f8ff}
      .h{font-size:17px;font-weight:800;fill:#f8fbff}
      .t{font-size:13px;font-weight:500;fill:#d0dceb}
      .s{font-size:11px;font-weight:500;fill:#9eb2c9}
      .rel{font-size:11px;font-weight:800;fill:#81d9e4}
      .card{fill:#122d48;stroke:#33597d;stroke-width:1.4}
      .schema{fill:#10253c;stroke:#6e8ead;stroke-width:1.4;stroke-dasharray:6 5}
      .edge{fill:none;stroke:#6f91b7;stroke-width:1.8;marker-end:url(#a)}
      .accent{fill:none;stroke:#39c4d7;stroke-width:2.4;marker-end:url(#ac)}
      .dash{fill:none;stroke:#6f91b7;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#a)}
    </style>
  </defs>

  <rect width="1800" height="1300" fill="url(#bg)"/>
  <circle cx="1650" cy="100" r="240" fill="#28b3ca" opacity=".07"/>
  <circle cx="130" cy="1180" r="270" fill="#2d73db" opacity=".07"/>

  <g class="ko">
    <text x="60" y="62" class="title">KNCCS Proposal Knowledge Graph</text>
    <text x="60" y="92" class="sub">GraphRAG 처리 구조 + 도메인 온톨로지 · OpenCrab pack: 문서 1 / 노드 528 / 엣지 2,824</text>

    <g filter="url(#shadow)">
      <rect x="500" y="125" width="800" height="105" rx="24" fill="url(#hero)" stroke="#79d8e7"/>
      <text x="900" y="168" text-anchor="middle" class="h" style="font-size:23px">′26년 KNCCS 노후 네트워크장비 교체사업</text>
      <text x="900" y="199" text-anchor="middle" class="t" style="fill:#e8f8ff">정성제안서 원본 → 의미 엔터티 → 관계 그래프 → 근거 기반 질의응답</text>
    </g>

    <!-- section titles -->
    <text x="60" y="285" class="section">A. 도메인 온톨로지</text>
    <text x="1040" y="285" class="section">B. GraphRAG 질의 처리</text>
    <line x1="985" y1="270" x2="985" y2="1035" stroke="#315473" stroke-width="1"/>

    <!-- Ontology center -->
    <g filter="url(#shadow)">
      <ellipse cx="510" cy="520" rx="145" ry="70" fill="#174f7d" stroke="#46c5d6" stroke-width="2"/>
      <text x="510" y="510" text-anchor="middle" class="h">사업</text>
      <text x="510" y="536" text-anchor="middle" class="t">KNCCS 장비 교체</text>
      <text x="510" y="558" text-anchor="middle" class="s">무중단 · 안정성 · 보안</text>
    </g>

    <!-- ontology nodes -->
    <g filter="url(#shadow)">
      <rect class="card" x="70" y="330" width="245" height="125" rx="16"/>
      <text x="92" y="365" class="h">요구사항</text>
      <text x="92" y="394" class="t">PER / SIR / SFR / ENR</text>
      <text x="92" y="418" class="t">SER / PMR / CNR / MPR</text>
      <text x="92" y="440" class="s">규격·기능·구축·관리 요구</text>

      <rect class="card" x="365" y="315" width="290" height="125" rx="16"/>
      <text x="387" y="350" class="h">장비</text>
      <text x="387" y="379" class="t">백본 A/B · L4 스위치</text>
      <text x="387" y="403" class="t">OS9907 · PAS-K5200</text>
      <text x="387" y="425" class="s">모델·제조사·수량·설치부대</text>

      <rect class="card" x="705" y="330" width="245" height="125" rx="16"/>
      <text x="727" y="365" class="h">기술 기능</text>
      <text x="727" y="394" class="t">IPv4/6 · OSPF · BGP</text>
      <text x="727" y="418" class="t">VLAN · VRRP · LACP</text>
      <text x="727" y="440" class="s">성능·인터페이스·상호운용</text>

      <rect class="card" x="60" y="525" width="250" height="125" rx="16"/>
      <text x="82" y="560" class="h">조직·인력</text>
      <text x="82" y="589" class="t">PM · PL · 권역별 조직</text>
      <text x="82" y="613" class="t">제안사 · 제조사 · 운용자</text>
      <text x="82" y="635" class="s">책임·수행·승인 주체</text>

      <rect class="card" x="710" y="525" width="250" height="125" rx="16"/>
      <text x="732" y="560" class="h">수행 활동</text>
      <text x="732" y="589" class="t">실사 · 분석 · 최적화</text>
      <text x="732" y="613" class="t">설정이관 · 순차교체</text>
      <text x="732" y="635" class="s">준비 → 이행 → 안정화</text>

      <rect class="card" x="70" y="715" width="245" height="125" rx="16"/>
      <text x="92" y="750" class="h">리스크·대응</text>
      <text x="92" y="779" class="t">서비스 중단 · 설정 누락</text>
      <text x="92" y="803" class="t">프로토콜 불일치 · 장애</text>
      <text x="92" y="825" class="s">예방·원복·우회·보고</text>

      <rect class="card" x="365" y="730" width="290" height="125" rx="16"/>
      <text x="387" y="765" class="h">시험·검수</text>
      <text x="387" y="794" class="t">성능 · 상호운용 · 이중화</text>
      <text x="387" y="818" class="t">보안적합성 · OTDR</text>
      <text x="387" y="840" class="s">요구사항 충족 여부 검증</text>

      <rect class="card" x="705" y="715" width="245" height="125" rx="16"/>
      <text x="727" y="750" class="h">산출물·증빙</text>
      <text x="727" y="779" class="t">시험결과 · 완료확인서</text>
      <text x="727" y="803" class="t">S/N · 인증서 · 종결보고</text>
      <text x="727" y="825" class="s">페이지·버전·승인 추적</text>
    </g>

    <!-- ontology edges -->
    <path class="accent" d="M315 393 C385 415 405 445 440 474"/>
    <text x="367" y="412" class="rel">정의한다</text>
    <path class="accent" d="M510 440 L510 450"/>
    <text x="522" y="455" class="rel">도입한다</text>
    <path class="accent" d="M705 393 C640 414 614 446 580 474"/>
    <text x="634" y="412" class="rel">지원한다</text>
    <path class="edge" d="M310 588 L365 548"/>
    <text x="320" y="552" class="rel">수행</text>
    <path class="edge" d="M655 548 L710 588"/>
    <text x="662" y="552" class="rel">실행</text>
    <path class="edge" d="M445 586 C377 645 300 680 260 715"/>
    <text x="335" y="665" class="rel">식별·통제</text>
    <path class="edge" d="M575 586 C640 645 715 680 760 715"/>
    <text x="650" y="665" class="rel">생성</text>
    <path class="accent" d="M315 778 L365 792"/>
    <text x="326" y="773" class="rel">검증대상</text>
    <path class="accent" d="M655 792 L705 778"/>
    <text x="666" y="773" class="rel">증빙한다</text>
    <path class="dash" d="M825 715 C880 650 910 535 825 455"/>
    <text x="888" y="586" class="rel">충족 근거</text>

    <!-- ontology schema layer -->
    <rect class="schema" x="70" y="900" width="880" height="120" rx="16"/>
    <text x="92" y="933" class="h">OpenCrab 저장 계층</text>
    <text x="92" y="967" class="t">Document</text>
    <path class="edge" d="M175 963 L258 963"/>
    <text x="275" y="967" class="t">Evidence Chunk</text>
    <path class="edge" d="M395 963 L478 963"/>
    <text x="495" y="967" class="t">Concept Node</text>
    <path class="edge" d="M610 963 L693 963"/>
    <text x="710" y="967" class="t">Semantic Edge</text>
    <text x="92" y="998" class="s">원문 위치·텍스트 → 개념 추출 → 관계 연결. table/rowspan/페이지 숫자 등 변환 잡음은 검색 가중치에서 제외 권장</text>

    <!-- GraphRAG pipeline -->
    <g filter="url(#shadow)">
      <rect class="card" x="1040" y="330" width="300" height="95" rx="16"/>
      <circle cx="1080" cy="377" r="21" fill="#246cc6"/>
      <text x="1080" y="383" text-anchor="middle" class="h">1</text>
      <text x="1115" y="365" class="h">사용자 질의 해석</text>
      <text x="1115" y="394" class="t">의도·엔터티·요구번호 추출</text>

      <rect class="card" x="1425" y="330" width="315" height="95" rx="16"/>
      <circle cx="1465" cy="377" r="21" fill="#246cc6"/>
      <text x="1465" y="383" text-anchor="middle" class="h">2</text>
      <text x="1500" y="365" class="h">하이브리드 검색</text>
      <text x="1500" y="394" class="t">키워드 + 벡터 + pack 범위</text>

      <rect class="card" x="1425" y="485" width="315" height="95" rx="16"/>
      <circle cx="1465" cy="532" r="21" fill="#26a7b4"/>
      <text x="1465" y="538" text-anchor="middle" class="h">3</text>
      <text x="1500" y="520" class="h">시드 노드 선택</text>
      <text x="1500" y="549" class="t">요구사항·장비·기능 Top-K</text>

      <rect class="card" x="1040" y="485" width="300" height="95" rx="16"/>
      <circle cx="1080" cy="532" r="21" fill="#26a7b4"/>
      <text x="1080" y="538" text-anchor="middle" class="h">4</text>
      <text x="1115" y="520" class="h">그래프 이웃 확장</text>
      <text x="1115" y="549" class="t">1~2 hop 관계·경로 수집</text>

      <rect class="card" x="1040" y="640" width="300" height="95" rx="16"/>
      <circle cx="1080" cy="687" r="21" fill="#8b69db"/>
      <text x="1080" y="693" text-anchor="middle" class="h">5</text>
      <text x="1115" y="675" class="h">Evidence 결합</text>
      <text x="1115" y="704" class="t">원문 청크·페이지·증빙 연결</text>

      <rect class="card" x="1425" y="640" width="315" height="95" rx="16"/>
      <circle cx="1465" cy="687" r="21" fill="#8b69db"/>
      <text x="1465" y="693" text-anchor="middle" class="h">6</text>
      <text x="1500" y="675" class="h">재순위·컨텍스트 구성</text>
      <text x="1500" y="704" class="t">관련성·근거성·중복 제거</text>

      <rect x="1190" y="810" width="400" height="110" rx="20" fill="url(#hero)" stroke="#74d7e4" filter="url(#shadow)"/>
      <text x="1390" y="850" text-anchor="middle" class="h" style="font-size:20px">7. 근거 기반 답변 생성</text>
      <text x="1390" y="882" text-anchor="middle" class="t" style="fill:#ebfbff">관계 경로 + 원문 인용 + 불확실성 표시</text>
    </g>

    <!-- pipeline arrows -->
    <path class="accent" d="M1340 377 L1425 377"/>
    <path class="accent" d="M1582 425 L1582 485"/>
    <path class="accent" d="M1425 532 L1340 532"/>
    <path class="accent" d="M1190 580 L1190 640"/>
    <path class="accent" d="M1340 687 L1425 687"/>
    <path class="accent" d="M1582 735 C1582 780 1530 790 1510 810"/>
    <path class="dash" d="M1040 532 C1005 532 1000 590 960 590"/>
    <text x="994" y="575" class="rel">온톨로지 조회</text>

    <!-- examples -->
    <rect class="schema" x="1040" y="965" width="700" height="160" rx="16"/>
    <text x="1065" y="1000" class="h">예시 질의</text>
    <text x="1065" y="1032" class="t">① “무중단 교체 요구사항과 원복·안정화 대응 근거는 무엇인가?”</text>
    <text x="1065" y="1062" class="t">② “백본 A/B형과 L4 장비의 규격·기능·검증 증빙을 비교하라.”</text>
    <text x="1065" y="1092" class="t">③ “SER-001/002 보안 요구에서 필요한 절차와 산출물을 연결하라.”</text>

    <!-- footer -->
    <line x1="60" y1="1180" x2="1740" y2="1180" stroke="#315473"/>
    <text x="60" y="1214" class="s">실선: 도메인 의미 관계 · 점선: 저장/검색 및 근거 추적 관계</text>
    <text x="60" y="1240" class="s">현재 팩은 evidence 중심 하이브리드 검색 결과가 강함 → 요구사항 ID 및 도메인 관계 엣지 보강 시 GraphRAG 경로 검색 품질 향상</text>
    <text x="1740" y="1240" text-anchor="end" class="s">OpenCrab ontology pack · 2026-07-28</text>
  </g>
</svg>
